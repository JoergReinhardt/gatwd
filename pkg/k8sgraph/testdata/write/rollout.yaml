# Workloads for the rollout tests. `web` has a three-revision history (ReplicaSets web-aaa,
# web-bbb, web-ccc; revision 3 is current); `slow` is mid-rollout; `halted` is paused;
# `db` and `agent` exist to show which operations a kind does not support.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: default
  generation: 3
  annotations:
    deployment.kubernetes.io/revision: "3"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
status:
  observedGeneration: 3
  replicas: 3
  updatedReplicas: 3
  availableReplicas: 3
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: web-aaa
  namespace: default
  labels: {app: web}
  annotations:
    deployment.kubernetes.io/revision: "1"
  ownerReferences:
    - {apiVersion: apps/v1, kind: Deployment, name: web}
spec:
  replicas: 0
  template:
    metadata:
      labels: {app: web, pod-template-hash: aaa}
    spec:
      containers:
        - {name: web, image: "nginx:1.25"}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: web-bbb
  namespace: default
  labels: {app: web}
  annotations:
    deployment.kubernetes.io/revision: "2"
  ownerReferences:
    - {apiVersion: apps/v1, kind: Deployment, name: web}
spec:
  replicas: 0
  template:
    metadata:
      labels: {app: web, pod-template-hash: bbb}
    spec:
      containers:
        - {name: web, image: "nginx:1.26"}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: web-ccc
  namespace: default
  labels: {app: web}
  annotations:
    deployment.kubernetes.io/revision: "3"
  ownerReferences:
    - {apiVersion: apps/v1, kind: Deployment, name: web}
spec:
  replicas: 3
  template:
    metadata:
      labels: {app: web, pod-template-hash: ccc}
    spec:
      containers:
        - {name: web, image: "nginx:1.27"}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: other-zzz
  namespace: default
  labels: {app: web}
  annotations:
    deployment.kubernetes.io/revision: "9"
  ownerReferences:
    - {apiVersion: apps/v1, kind: Deployment, name: not-web}
spec:
  template:
    metadata:
      labels: {app: web, pod-template-hash: zzz}
    spec:
      containers:
        - {name: web, image: "evil:9"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow
  namespace: default
  generation: 2
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 3
  selector:
    matchLabels: {app: slow}
  template:
    metadata:
      labels: {app: slow}
    spec:
      containers:
        - {name: slow, image: "slow:2"}
status:
  observedGeneration: 2
  replicas: 4
  updatedReplicas: 1
  availableReplicas: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halted
  namespace: default
  generation: 1
spec:
  paused: true
  replicas: 1
  selector:
    matchLabels: {app: halted}
  template:
    metadata:
      labels: {app: halted}
    spec:
      containers:
        - {name: halted, image: "halted:1"}
status:
  observedGeneration: 1
  replicas: 1
  updatedReplicas: 1
  availableReplicas: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: default
spec:
  replicas: 1
  template:
    metadata:
      labels: {app: db}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: default
spec:
  template:
    metadata:
      labels: {app: agent}
