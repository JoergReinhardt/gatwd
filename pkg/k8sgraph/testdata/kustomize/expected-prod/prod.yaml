# The plain manifests that overlays/prod must render to, written out by hand from the
# base and the overlay (prefix prod-, namespace prod, label env=prod, the warn patch,
# references renamed with their targets). Parity test: this directory read as plain
# files and overlays/prod rendered in process must be the same set of resources, and
# build the same graph.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prod-web-config
  namespace: prod
  labels:
    env: prod
data:
  mode: base
---
apiVersion: v1
kind: Service
metadata:
  name: prod-web-svc
  namespace: prod
  labels:
    env: prod
spec:
  selector:
    app: web
  ports:
    - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prod-web-ing
  namespace: prod
  labels:
    env: prod
spec:
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prod-web-svc
                port:
                  number: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: prod-web-pod
  namespace: prod
  labels:
    app: web
    env: prod
spec:
  containers:
    - name: web
      image: nginx:1.27
      env:
        - name: LOG_LEVEL
          value: warn
  volumes:
    - name: config
      configMap:
        name: prod-web-config
