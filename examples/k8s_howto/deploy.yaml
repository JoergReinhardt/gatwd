apiVersion: v1
kind: Namespace
metadata:
  name: gatwd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatwd-k8s-operator
  namespace: gatwd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gatwd-k8s-operator
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, endpoints, persistentvolumeclaims, serviceaccounts]  # add "secrets" only if you keep k8s_secrets
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gatwd-k8s-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gatwd-k8s-operator
subjects:
  - kind: ServiceAccount
    name: gatwd-k8s-operator
    namespace: gatwd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatwd-k8s-operator
  namespace: gatwd
spec:
  replicas: 1
  selector:
    matchLabels: {app: gatwd-k8s-operator}
  template:
    metadata:
      labels: {app: gatwd-k8s-operator}
    spec:
      serviceAccountName: gatwd-k8s-operator
      securityContext: {runAsNonRoot: true, runAsUser: 65532}
      containers:
        - name: operator
          image: registry.example.com/gatwd-k8s-operator:0.1.0
          args: ["run", "--namespace", "", "--interval", "5m"]
          volumeMounts:
            - {name: rules, mountPath: /etc/gatwd, readOnly: true}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
      volumes:
        - name: rules
          configMap:
            name: gatwd-rules
            optional: true
