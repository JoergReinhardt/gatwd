apiVersion: v1
kind: ConfigMap
metadata: {name: app-config, namespace: demo}
data:
  # resolves to Service/other/backend: this cluster's internal DNS is "<svc>.<ns>.svc", not
  # Kubernetes' default "<svc>.<ns>.svc.cluster.local" (see sipwise-broker/base/configmap.yaml
  # in the real gitops repo for the pattern this fixture follows).
  DOWNSTREAM_URL: "http://backend.other.svc"
  # resolves to Ingress/demo/ext: an external-dns hostname this cluster answers for, reached
  # through the external load balancer and back in (that hop is not a Kubernetes resource).
  EXTERNAL_URL: "https://foo.k8s.easybell.de/path"
  # a real but unrelated external URL: never a dependency edge, just noise to filter out.
  UNRELATED_URL: "https://example.com"
  MODE: "prod"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app, namespace: demo}
spec:
  selector: {matchLabels: {app: app}}
  template:
    metadata: {labels: {app: app, tier: web}}
    spec:
      containers:
        - name: app
          image: example/app:1
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: app-config}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: other}
spec:
  selector: {app: backend}
  ports: [{name: http, port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: ext, namespace: demo}
spec:
  rules:
    - host: foo.k8s.easybell.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: app, port: {name: http}}}
---
apiVersion: v1
kind: Service
metadata: {name: app, namespace: demo}
spec:
  selector: {app: app}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: orphan, namespace: demo}
spec:
  selector: {app: nothing}
  ports: [{name: http, port: 80}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db, namespace: demo}
spec:
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db, tier: data}}
    spec:
      containers:
        - name: db
          image: example/db:1
          ports: [{name: sql, containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: db, namespace: demo}
spec:
  selector: {app: db}
  ports: [{name: sql, port: 5432, targetPort: sql}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: demo
  annotations:
    external-dns.alpha.kubernetes.io/target: 10.0.0.7
spec:
  rules:
    - host: demo.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: app, port: {name: http}}}
    - host: orphan.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: orphan, port: {name: http}}}
    - host: db.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: db, port: {name: sql}}}
