apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-rs
  ownerReferences:
    - kind: Deployment
      name: nginx-deploy
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx
  ownerReferences:
    - kind: ReplicaSet
      name: nginx-rs
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  selector:
    app: nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            backend:
              service:
                name: nginx-svc
